name: Deploy Todo App

on:
  push:
    branches:
      - main  # 只有 push 到 main 分支会触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取最新代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ 上传 todo-app.html 到服务器
      - name: Copy todo-app.html to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "claude-code-todo-demo/todo-app.html"
          target: "/home/my-website-ui/todo-demo-ui/"

      # 3️⃣ 重启 Docker 容器
      - name: Restart Docker container
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/nginx
            docker compose down
            docker compose up -d
