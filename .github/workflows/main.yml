name: Deploy Todo App

on:
  push:
    branches:
      - main  # 只有 push 到 main 分支会触发
    paths:
      - "claude-code-todo-demo/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取最新代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 上传 todo-app.html 到服务器
      - name: Copy todo-app.html to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "claude-code-todo-demo/todo-app.html"
          target: "/tmp/"
          strip_components: 1

      # 3️⃣ 替换服务器文件
      - name: Deploy todo-app.html
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rm -f /home/my-website-ui/todo-demo-ui/todo-app.html
            mv /tmp/todo-app.html /home/my-website-ui/todo-demo-ui/
