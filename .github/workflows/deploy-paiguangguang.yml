name: Deploy Paiguangguang

on:
  push:
    branches:
      - main
    paths:
      - "paiguangguang/frontend/**"
      - "paiguangguang/backend/**"
      - "paiguangguang/deploy/docker-compose.yml"
      - "paiguangguang/deploy/deploy.sh"
      - "paiguangguang/deploy/nginx/**"
      - ".github/workflows/deploy-paiguangguang.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paiguangguang-production
  cancel-in-progress: false

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paiguangguang/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: paiguangguang/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paiguangguang
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paiguangguang/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          CHROMA_PATH: ${{ runner.temp }}/paiguangguang-chroma
        run: python -m pytest backend/tests -q

  publish-images:
    needs:
      - frontend-check
      - backend-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - service: frontend
            context: ./paiguangguang/frontend
            dockerfile: ./paiguangguang/frontend/Dockerfile
            repository: ${{ vars.TCR_FRONTEND_REPOSITORY }}
            cache_scope: paiguangguang-frontend
            build_args: |
              NEXT_PUBLIC_BACKEND_URL=
              NEXT_PUBLIC_CHATBOT_ENABLED=true
          - service: backend
            context: ./paiguangguang/backend
            dockerfile: ./paiguangguang/backend/Dockerfile
            repository: ${{ vars.TCR_BACKEND_REPOSITORY }}
            cache_scope: paiguangguang-backend
            build_args: ""
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate TCR configuration
        env:
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          TCR_REPOSITORY: ${{ matrix.repository }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -eu
          test -n "$TCR_REGISTRY" || { echo "Repository variable TCR_REGISTRY is required" >&2; exit 1; }
          test -n "$TCR_NAMESPACE" || { echo "Repository variable TCR_NAMESPACE is required" >&2; exit 1; }
          test -n "$TCR_REPOSITORY" || { echo "TCR repository variable for ${{ matrix.service }} is required" >&2; exit 1; }
          test -n "$TCR_USERNAME" || { echo "Repository secret TCR_USERNAME is required" >&2; exit 1; }
          test -n "$TCR_PASSWORD" || { echo "Repository secret TCR_PASSWORD is required" >&2; exit 1; }
      - name: Log in to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}/${{ matrix.repository }}:${{ github.sha }}
            ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}/${{ matrix.repository }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  deploy:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload deployment manifests
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "paiguangguang/deploy/docker-compose.yml,paiguangguang/deploy/deploy.sh,paiguangguang/deploy/nginx,paiguangguang/backend/prod.env"
          target: "/tmp/paiguangguang-${{ github.sha }}"
          strip_components: 2
      - name: Deploy immutable images
        uses: appleboy/ssh-action@v1
        env:
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          TCR_FRONTEND_REPOSITORY: ${{ vars.TCR_FRONTEND_REPOSITORY }}
          TCR_BACKEND_REPOSITORY: ${{ vars.TCR_BACKEND_REPOSITORY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 180m
          envs: TCR_REGISTRY,TCR_NAMESPACE,TCR_USERNAME,TCR_PASSWORD,TCR_FRONTEND_REPOSITORY,TCR_BACKEND_REPOSITORY
          script: |
            set -eu
            : "${TCR_REGISTRY:?TCR_REGISTRY is required}"
            : "${TCR_NAMESPACE:?TCR_NAMESPACE is required}"
            : "${TCR_USERNAME:?TCR_USERNAME is required}"
            : "${TCR_PASSWORD:?TCR_PASSWORD is required}"
            : "${TCR_FRONTEND_REPOSITORY:?TCR_FRONTEND_REPOSITORY is required}"
            : "${TCR_BACKEND_REPOSITORY:?TCR_BACKEND_REPOSITORY is required}"
            printf '%s' "$TCR_PASSWORD" | docker login "$TCR_REGISTRY" --username "$TCR_USERNAME" --password-stdin
            frontend_image="$TCR_REGISTRY/$TCR_NAMESPACE/$TCR_FRONTEND_REPOSITORY"
            backend_image="$TCR_REGISTRY/$TCR_NAMESPACE/$TCR_BACKEND_REPOSITORY"
            release_dir="/tmp/paiguangguang-${{ github.sha }}"
            app_dir="/home/my-website-ui/paiguangguang"
            install -d -m 755 "$app_dir"
            install -d -m 700 "$app_dir/backend"
            install -m 644 "$release_dir/docker-compose.yml" "$app_dir/docker-compose.yml"
            install -m 755 "$release_dir/deploy.sh" "$app_dir/deploy.sh"
            install -m 600 "$release_dir/prod.env" "$app_dir/backend/prod.env"
            "$app_dir/deploy.sh" "${{ github.sha }}" "$frontend_image" "$backend_image"
            bash "$release_dir/nginx/deploy-nginx.sh" "$release_dir/nginx"
            rm -rf "$release_dir"
