name: Deploy Paiguangguang

on:
  push:
    branches:
      - main
    paths:
      - "paiguangguang/frontend/**"
      - "paiguangguang/backend/**"
      - "paiguangguang/deploy/docker-compose.yml"
      - "paiguangguang/deploy/deploy.sh"
      - "paiguangguang/deploy/nginx/**"
      - ".github/workflows/deploy-paiguangguang.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paiguangguang-production
  cancel-in-progress: false

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paiguangguang/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: paiguangguang/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paiguangguang
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paiguangguang/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          CHROMA_PATH: ${{ runner.temp }}/paiguangguang-chroma
        run: python -m pytest backend/tests -q

  publish-images:
    needs:
      - frontend-check
      - backend-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - service: frontend
            context: ./paiguangguang/frontend
            dockerfile: ./paiguangguang/frontend/Dockerfile
            image: ghcr.io/totorokingdom/paiguangguang-frontend
            cache_scope: paiguangguang-frontend
            build_args: |
              NEXT_PUBLIC_BACKEND_URL=
              NEXT_PUBLIC_CHATBOT_ENABLED=true
          - service: backend
            context: ./paiguangguang/backend
            dockerfile: ./paiguangguang/backend/Dockerfile
            image: ghcr.io/totorokingdom/paiguangguang-backend
            cache_scope: paiguangguang-backend
            build_args: ""
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  deploy:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload deployment manifests
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "paiguangguang/deploy/docker-compose.yml,paiguangguang/deploy/deploy.sh,paiguangguang/deploy/nginx"
          target: "/tmp/paiguangguang-${{ github.sha }}"
          strip_components: 2
      - name: Deploy immutable images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 180m
          script: |
            set -eu
            release_dir="/tmp/paiguangguang-${{ github.sha }}"
            app_dir="/home/my-website-ui/paiguangguang"
            install -d -m 755 "$app_dir"
            install -m 644 "$release_dir/docker-compose.yml" "$app_dir/docker-compose.yml"
            install -m 755 "$release_dir/deploy.sh" "$app_dir/deploy.sh"
            "$app_dir/deploy.sh" "${{ github.sha }}"
            bash "$release_dir/nginx/deploy-nginx.sh" "$release_dir/nginx"
            rm -rf "$release_dir"
