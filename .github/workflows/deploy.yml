name: Deploy paiguangguang-ai

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: paiguangguang-ai-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set GHCR image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}-backend:latest" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: ASSISTANT_API_INTERNAL_URL=http://backend:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            install -d -m 755 /opt/paiguangguang-ai

      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/paiguangguang-ai

      - name: Pull and restart production container
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          BACKEND_IMAGE_NAME: ${{ steps.image.outputs.backend }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSISTANT_OWNER_COOKIE_SECRET: ${{ secrets.ASSISTANT_OWNER_COOKIE_SECRET }}
          ASSISTANT_ALLOWED_ORIGINS: ${{ vars.ASSISTANT_ALLOWED_ORIGINS }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_NAME,BACKEND_IMAGE_NAME,GHCR_USERNAME,GHCR_TOKEN,ASSISTANT_OWNER_COOKIE_SECRET,ASSISTANT_ALLOWED_ORIGINS
          script: |
            set -eu
            app_dir=/opt/paiguangguang-ai
            install -d -m 755 "$app_dir"
            test -n "$ASSISTANT_OWNER_COOKIE_SECRET"
            test -n "$ASSISTANT_ALLOWED_ORIGINS"
            {
              printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME"
              printf 'BACKEND_IMAGE_NAME=%s\n' "$BACKEND_IMAGE_NAME"
              printf 'ASSISTANT_OWNER_COOKIE_SECRET=%s\n' "$ASSISTANT_OWNER_COOKIE_SECRET"
              printf 'ASSISTANT_OWNER_COOKIE_SECURE=true\n'
              printf 'ASSISTANT_ALLOWED_ORIGINS=%s\n' "$ASSISTANT_ALLOWED_ORIGINS"
              printf 'ASSISTANT_DATA_VOLUME=paiguangguang-ai-assistant-data\n'
            } > "$app_dir/.env"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            cd "$app_dir"
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            test "$(docker inspect --format='{{.State.Health.Status}}' paiguangguang-ai-backend)" = healthy
            docker image prune -f
            docker logout ghcr.io
