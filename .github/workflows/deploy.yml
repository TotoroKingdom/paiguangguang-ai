name: Deploy paiguangguang-ai

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: paiguangguang-ai-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before production deploy
    uses: ./.github/workflows/assistant-session-ci.yml

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set GHCR image names
        id: image
        shell: bash
        run: |
          frontend_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          backend_base="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          echo "frontend_latest=${frontend_base}:latest" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${backend_base}:latest" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend_base}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=${backend_base}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.frontend }}
            ${{ steps.image.outputs.frontend_latest }}
          build-args: ASSISTANT_API_INTERNAL_URL=http://backend:8000
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.backend }}
            ${{ steps.image.outputs.backend_latest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read-only production preflight
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            app_dir=/opt/paiguangguang-ai
            docker info >/dev/null
            if [ -d "$app_dir" ]; then
              printf 'app_dir=present\n'
              if [ -f "$app_dir/.env" ]; then
                env_mode="$(stat -c '%a' "$app_dir/.env")"
                printf 'env_mode=%s\n' "$env_mode"
                if [ "$env_mode" != 600 ] && [ "$env_mode" != 400 ]; then
                  echo 'legacy or insecure .env mode detected; deployment will replace it with mode 600'
                fi
                if grep -q '^ASSISTANT_DATA_VOLUME=.' "$app_dir/.env"; then
                  volume_name="$(sed -n 's/^ASSISTANT_DATA_VOLUME=//p' "$app_dir/.env" | head -n 1)"
                elif grep -q '^IMAGE_NAME=.' "$app_dir/.env"; then
                  volume_name=paiguangguang-ai-assistant-data
                  echo 'legacy .env detected; existing frontend image will be preserved for rollback'
                else
                  volume_name=paiguangguang-ai-assistant-data
                  echo 'unrecognized .env detected; deployment will fail closed if required settings are absent'
                fi
                if docker volume inspect "$volume_name" >/dev/null 2>&1; then
                  printf 'data_volume=%s\n' "$volume_name"
                else
                  printf 'data_volume=%s (not created yet)\n' "$volume_name"
                fi
              else
                echo 'production .env absent: initial deployment will create it'
              fi
              if [ -f "$app_dir/docker-compose.yml" ]; then
                echo 'compose_file=present; rollback copy will be created'
              else
                echo 'compose_file=absent'
              fi
              if [ -d "$app_dir/backups" ]; then
                printf 'backup_dir_mode=%s\n' "$(stat -c '%a' "$app_dir/backups")"
                find "$app_dir/backups" -maxdepth 1 -type f -name 'assistant-*.db' -printf '%f %m\n' || true
              else
                echo 'backup_dir=absent; deployment will create it'
              fi
              docker ps --format '{{.Names}} {{.Image}} {{.Status}}' || true
              df -h "$app_dir"
            else
              echo 'production directory absent: initial deployment preflight'
            fi

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            install -d -m 700 /opt/paiguangguang-ai
            install -d -m 700 /opt/paiguangguang-ai/.incoming

      - name: Upload next docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/paiguangguang-ai/.incoming

      - name: Pull, migrate, restart, and verify production
        id: deploy_production
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ steps.image.outputs.frontend }}
          BACKEND_IMAGE_NAME: ${{ steps.image.outputs.backend }}
          DEPLOY_COMMIT: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSISTANT_OWNER_COOKIE_SECRET: ${{ secrets.ASSISTANT_OWNER_COOKIE_SECRET }}
          ASSISTANT_ALLOWED_ORIGINS: ${{ vars.ASSISTANT_ALLOWED_ORIGINS }}
          ASSISTANT_ADMIN_USERNAME: ${{ vars.ASSISTANT_ADMIN_USERNAME }}
          ASSISTANT_ADMIN_PASSWORD: ${{ secrets.ASSISTANT_ADMIN_PASSWORD }}
          ASSISTANT_LLM_PROVIDER: ${{ vars.ASSISTANT_LLM_PROVIDER }}
          ASSISTANT_LLM_BASE_URL: ${{ vars.ASSISTANT_LLM_BASE_URL }}
          ASSISTANT_LLM_MODEL: ${{ vars.ASSISTANT_LLM_MODEL }}
          ASSISTANT_LLM_API_KEY: ${{ secrets.ASSISTANT_LLM_API_KEY }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_NAME,BACKEND_IMAGE_NAME,DEPLOY_COMMIT,GHCR_USERNAME,GHCR_TOKEN,ASSISTANT_OWNER_COOKIE_SECRET,ASSISTANT_ALLOWED_ORIGINS,ASSISTANT_ADMIN_USERNAME,ASSISTANT_ADMIN_PASSWORD,ASSISTANT_LLM_PROVIDER,ASSISTANT_LLM_BASE_URL,ASSISTANT_LLM_MODEL,ASSISTANT_LLM_API_KEY
          script: |
            set -eu
            umask 077
            app_dir=/opt/paiguangguang-ai
            rollback_env="$app_dir/.env.rollback"
            rollback_compose="$app_dir/.docker-compose.rollback.yml"
            incoming_compose="$app_dir/.incoming/docker-compose.yml"
            old_frontend_image_ref=""
            old_backend_image_ref=""
            existing_volume_name=""

            if docker inspect paiguangguang-ai-frontend >/dev/null 2>&1; then
              old_frontend_image_ref="$(docker inspect --format='{{.Config.Image}}' paiguangguang-ai-frontend)"
            fi
            if docker inspect paiguangguang-ai-backend >/dev/null 2>&1; then
              old_backend_image_ref="$(docker inspect --format='{{.Config.Image}}' paiguangguang-ai-backend)"
            fi
            if [ -n "$old_frontend_image_ref" ]; then
              printf '%s\n' "$old_frontend_image_ref" > "$app_dir/.rollback-image"
              chmod 600 "$app_dir/.rollback-image"
            else
              rm -f "$app_dir/.rollback-image"
            fi
            if [ -n "$old_backend_image_ref" ]; then
              printf '%s\n' "$old_backend_image_ref" > "$app_dir/.rollback-backend-image"
              chmod 600 "$app_dir/.rollback-backend-image"
            else
              rm -f "$app_dir/.rollback-backend-image"
            fi
            if [ -f "$app_dir/.env" ]; then
              install -m 600 "$app_dir/.env" "$rollback_env"
              existing_volume_name="$(sed -n 's/^ASSISTANT_DATA_VOLUME=//p' "$app_dir/.env" | head -n 1)"
            fi
            if [ -f "$app_dir/docker-compose.yml" ]; then
              install -m 600 "$app_dir/docker-compose.yml" "$rollback_compose"
            fi

            rollback() {
              status="$1"
              trap - ERR
              set +e
              cd "$app_dir"
              echo "deployment failed with status $status; attempting rollback"
              if [ -f "$rollback_compose" ]; then
                install -m 644 "$rollback_compose" "$app_dir/docker-compose.yml"
              else
                rm -f "$app_dir/docker-compose.yml"
              fi
              if [ -f "$rollback_env" ]; then
                install -m 600 "$rollback_env" "$app_dir/.env"
                if [ -s "$app_dir/.rollback-image" ]; then
                  sed -i '/^IMAGE_NAME=/d' "$app_dir/.env"
                  printf 'IMAGE_NAME=%s\n' "$(cat "$app_dir/.rollback-image")" >> "$app_dir/.env"
                fi
                if [ -s "$app_dir/.rollback-backend-image" ]; then
                  sed -i '/^BACKEND_IMAGE_NAME=/d' "$app_dir/.env"
                  printf 'BACKEND_IMAGE_NAME=%s\n' "$(cat "$app_dir/.rollback-backend-image")" >> "$app_dir/.env"
                fi
                docker compose up -d --remove-orphans || true
              else
                docker compose down --remove-orphans || true
              fi
              docker logout ghcr.io >/dev/null 2>&1 || true
              exit "$status"
            }
            trap 'status=$?; rollback "$status"' ERR

            test -f "$incoming_compose"
            install -m 644 "$incoming_compose" "$app_dir/docker-compose.yml"
            rm -f "$incoming_compose"
            rmdir "$app_dir/.incoming" 2>/dev/null || true

            test -n "$ASSISTANT_OWNER_COOKIE_SECRET"
            printf '%s' "$ASSISTANT_OWNER_COOKIE_SECRET" | grep -Eq '^[A-Za-z0-9._~+/=-]{32,}$'
            test -n "$ASSISTANT_ALLOWED_ORIGINS"
            old_ifs="$IFS"
            IFS=','
            for origin in $ASSISTANT_ALLOWED_ORIGINS; do
              case "$origin" in
                https://?*) ;;
                *) echo 'ASSISTANT_ALLOWED_ORIGINS must contain HTTPS origins only' >&2; exit 1 ;;
              esac
            done
            IFS="$old_ifs"
            test -n "$ASSISTANT_LLM_PROVIDER"
            case "$(printf '%s' "$ASSISTANT_LLM_PROVIDER" | tr '[:upper:]' '[:lower:]')" in
              openai|openai-compatible|real) ;;
              *) echo 'ASSISTANT_LLM_PROVIDER must be a supported real provider' >&2; exit 1 ;;
            esac
            test -n "$ASSISTANT_LLM_BASE_URL"
            case "$ASSISTANT_LLM_BASE_URL" in
              https://?*) ;;
              *) echo 'ASSISTANT_LLM_BASE_URL must be an HTTPS URL' >&2; exit 1 ;;
            esac
            test -n "$ASSISTANT_LLM_MODEL"
            test -n "$ASSISTANT_LLM_API_KEY"

            volume_name="${existing_volume_name:-paiguangguang-ai-assistant-data}"
            printf '%s' "$volume_name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
            backup_dir="$app_dir/backups"
            install -d -m 700 "$backup_dir"
            chmod 700 "$backup_dir"

            {
              printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME"
              printf 'BACKEND_IMAGE_NAME=%s\n' "$BACKEND_IMAGE_NAME"
              printf 'DEPLOY_COMMIT=%s\n' "$DEPLOY_COMMIT"
              printf 'ASSISTANT_ENVIRONMENT=production\n'
              printf 'ASSISTANT_OWNER_COOKIE_SECRET=%s\n' "$ASSISTANT_OWNER_COOKIE_SECRET"
              printf 'ASSISTANT_OWNER_COOKIE_SECURE=true\n'
              printf 'ASSISTANT_ALLOWED_ORIGINS=%s\n' "$ASSISTANT_ALLOWED_ORIGINS"
              printf 'ASSISTANT_ADMIN_COOKIE_SECURE=true\n'
              if [ -n "${ASSISTANT_ADMIN_USERNAME:-}" ]; then
                printf 'ASSISTANT_ADMIN_USERNAME=%s\n' "$ASSISTANT_ADMIN_USERNAME"
              fi
              if [ -n "${ASSISTANT_ADMIN_PASSWORD:-}" ]; then
                printf 'ASSISTANT_ADMIN_PASSWORD=%s\n' "$ASSISTANT_ADMIN_PASSWORD"
              fi
              printf 'ASSISTANT_LLM_PROVIDER=%s\n' "$ASSISTANT_LLM_PROVIDER"
              printf 'ASSISTANT_LLM_BASE_URL=%s\n' "$ASSISTANT_LLM_BASE_URL"
              printf 'ASSISTANT_LLM_MODEL=%s\n' "$ASSISTANT_LLM_MODEL"
              printf 'ASSISTANT_LLM_API_KEY=%s\n' "$ASSISTANT_LLM_API_KEY"
              printf 'ASSISTANT_DATA_VOLUME=%s\n' "$volume_name"
            } > "$app_dir/.env"
            chmod 600 "$app_dir/.env"

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            cd "$app_dir"
            docker compose config --quiet
            docker compose pull
            docker run --rm --entrypoint python --env-file "$app_dir/.env" "$BACKEND_IMAGE_NAME" -m scripts.deploy_preflight

            if docker volume inspect "$volume_name" >/dev/null 2>&1; then
              database_status=0
              docker run --rm --entrypoint python --user 0 -v "$volume_name":/data "$BACKEND_IMAGE_NAME" -c "import os; raise SystemExit(0 if os.path.isfile('/data/assistant.db') else 3)" || database_status=$?
              if [ "$database_status" -eq 0 ]; then
                docker run --rm --entrypoint python --user 0 -v "$volume_name":/data -v "$backup_dir":/backup "$BACKEND_IMAGE_NAME" -c 'import os, sqlite3, time; src="/data/assistant.db"; dst="/backup/assistant-" + time.strftime("%Y%m%d-%H%M%S", time.gmtime()) + ".db"; con=sqlite3.connect(src); out=sqlite3.connect(dst); con.backup(out); out.close(); con.close(); os.chmod(dst, 0o600)'
                echo 'sqlite backup created'
              elif [ "$database_status" -eq 3 ]; then
                echo 'data volume exists without assistant.db; backup skipped'
              else
                echo 'unable to inspect existing SQLite volume; refusing deployment' >&2
                exit 1
              fi
            else
              echo 'no existing SQLite volume; backup skipped'
            fi

            docker compose up -d --remove-orphans
            docker compose ps

            for _ in $(seq 1 30); do
              backend_health="$(docker inspect --format='{{.State.Health.Status}}' paiguangguang-ai-backend 2>/dev/null || echo missing)"
              frontend_health="$(docker inspect --format='{{.State.Health.Status}}' paiguangguang-ai-frontend 2>/dev/null || echo missing)"
              if [ "$backend_health" = healthy ] && [ "$frontend_health" = healthy ]; then
                break
              fi
              sleep 2
            done

            test "$(docker inspect --format='{{.State.Health.Status}}' paiguangguang-ai-backend)" = healthy
            test "$(docker inspect --format='{{.State.Health.Status}}' paiguangguang-ai-frontend)" = healthy
            test "$(docker inspect --format='{{.Config.Image}}' paiguangguang-ai-frontend)" = "$IMAGE_NAME"
            test "$(docker inspect --format='{{.Config.Image}}' paiguangguang-ai-backend)" = "$BACKEND_IMAGE_NAME"
            curl -fsS http://127.0.0.1:3000/api/v1/health >/dev/null

            {
              printf 'DEPLOY_COMMIT=%s\n' "$DEPLOY_COMMIT"
              printf 'FRONTEND_IMAGE=%s\n' "$IMAGE_NAME"
              printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE_NAME"
              printf 'DATA_VOLUME=%s\n' "$volume_name"
              printf 'DEPLOYED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$app_dir/.deployment-record"
            chmod 600 "$app_dir/.deployment-record"

            trap - ERR
            docker logout ghcr.io || true

      - name: Verify public HTTPS health
        if: success()
        env:
          ASSISTANT_ALLOWED_ORIGINS: ${{ vars.ASSISTANT_ALLOWED_ORIGINS }}
        shell: bash
        run: |
          set -euo pipefail
          origin="${ASSISTANT_ALLOWED_ORIGINS%%,*}"
          origin="${origin%/}"
          case "$origin" in
            https://?*) ;;
            *) echo 'ASSISTANT_ALLOWED_ORIGINS must start with HTTPS' >&2; exit 1 ;;
          esac
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$origin/api/v1/health"; then
              exit 0
            fi
            echo "public health attempt $attempt failed; retrying"
            sleep 5
          done
          echo 'public HTTPS health check did not pass' >&2
          exit 1

      - name: Roll back failed public verification
        if: failure() && steps.deploy_production.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            app_dir=/opt/paiguangguang-ai
            cd "$app_dir"
            if [ -f "$app_dir/.docker-compose.rollback.yml" ] && [ -f "$app_dir/.env.rollback" ]; then
              install -m 644 "$app_dir/.docker-compose.rollback.yml" "$app_dir/docker-compose.yml"
              install -m 600 "$app_dir/.env.rollback" "$app_dir/.env"
              if [ -s "$app_dir/.rollback-image" ]; then
                sed -i '/^IMAGE_NAME=/d' "$app_dir/.env"
                printf 'IMAGE_NAME=%s\n' "$(cat "$app_dir/.rollback-image")" >> "$app_dir/.env"
              fi
              if [ -s "$app_dir/.rollback-backend-image" ]; then
                sed -i '/^BACKEND_IMAGE_NAME=/d' "$app_dir/.env"
                printf 'BACKEND_IMAGE_NAME=%s\n' "$(cat "$app_dir/.rollback-backend-image")" >> "$app_dir/.env"
              fi
              docker compose config --quiet
              docker compose up -d --remove-orphans
              docker compose ps
              docker logout ghcr.io >/dev/null 2>&1 || true
            else
              docker compose down --remove-orphans
              docker logout ghcr.io >/dev/null 2>&1 || true
              echo 'no previous deployment was available for rollback' >&2
              exit 1
            fi
