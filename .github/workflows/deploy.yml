name: Deploy paiguangguang-ai

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: paiguangguang-ai-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set GHCR image name
        id: image
        shell: bash
        run: |
          frontend_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          backend_base="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          echo "frontend_latest=${frontend_base}:latest" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${backend_base}:latest" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend_base}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=${backend_base}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.frontend }}
            ${{ steps.image.outputs.frontend_latest }}
          build-args: ASSISTANT_API_INTERNAL_URL=http://backend:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.backend }}
            ${{ steps.image.outputs.backend_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read-only production preflight
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            app_dir=/opt/paiguangguang-ai
            docker info >/dev/null
            if [ -d "$app_dir" ]; then
              find "$app_dir" -maxdepth 1 -type f -name '.env*' -printf '%f %m\n' || true
              docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
              df -h "$app_dir"
              if [ -f "$app_dir/.env" ]; then
                test "$(stat -c '%a' "$app_dir/.env")" = 600
                grep -q '^ASSISTANT_OWNER_COOKIE_SECRET=.' "$app_dir/.env"
                grep -q '^ASSISTANT_ALLOWED_ORIGINS=https://' "$app_dir/.env"
                volume_name="$(sed -n 's/^ASSISTANT_DATA_VOLUME=//p' "$app_dir/.env")"
                test -n "$volume_name"
                docker volume inspect "$volume_name" >/dev/null
                if [ -d "$app_dir/backups" ]; then
                  test "$(stat -c '%a' "$app_dir/backups")" = 700
                  find "$app_dir/backups" -maxdepth 1 -type f -name 'assistant-*.db' -printf '%f %m\n' || true
                fi
              fi
            else
              echo 'production directory absent: initial deployment preflight'
            fi

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            install -d -m 700 /opt/paiguangguang-ai

      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/paiguangguang-ai

      - name: Pull and restart production container
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ steps.image.outputs.frontend }}
          BACKEND_IMAGE_NAME: ${{ steps.image.outputs.backend }}
          DEPLOY_COMMIT: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSISTANT_OWNER_COOKIE_SECRET: ${{ secrets.ASSISTANT_OWNER_COOKIE_SECRET }}
          ASSISTANT_ALLOWED_ORIGINS: ${{ vars.ASSISTANT_ALLOWED_ORIGINS }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_NAME,BACKEND_IMAGE_NAME,DEPLOY_COMMIT,GHCR_USERNAME,GHCR_TOKEN,ASSISTANT_OWNER_COOKIE_SECRET,ASSISTANT_ALLOWED_ORIGINS
          script: |
            set -eu
            umask 077
            app_dir=/opt/paiguangguang-ai
            install -d -m 700 "$app_dir"
            rollback_env="$app_dir/.env.rollback"
            existing_volume_name=""
            if [ -f "$app_dir/.env" ]; then
              install -m 600 "$app_dir/.env" "$rollback_env"
              existing_volume_name="$(sed -n 's/^ASSISTANT_DATA_VOLUME=//p' "$app_dir/.env")"
            fi
            rollback() {
              if [ -f "$rollback_env" ]; then
                install -m 600 "$rollback_env" "$app_dir/.env"
                cd "$app_dir"
                docker compose up -d --remove-orphans || true
              fi
            }
            trap rollback ERR
            test -n "$ASSISTANT_OWNER_COOKIE_SECRET"
            test -n "$ASSISTANT_ALLOWED_ORIGINS"
            case "$ASSISTANT_ALLOWED_ORIGINS" in https://*) ;; *) echo 'ASSISTANT_ALLOWED_ORIGINS must use HTTPS' >&2; exit 1 ;; esac
            volume_name="${existing_volume_name:-paiguangguang-ai-assistant-data}"
            backup_dir="$app_dir/backups"
            install -d -m 700 "$backup_dir"
            {
              printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME"
              printf 'BACKEND_IMAGE_NAME=%s\n' "$BACKEND_IMAGE_NAME"
              printf 'DEPLOY_COMMIT=%s\n' "$DEPLOY_COMMIT"
              printf 'ASSISTANT_OWNER_COOKIE_SECRET=%s\n' "$ASSISTANT_OWNER_COOKIE_SECRET"
              printf 'ASSISTANT_OWNER_COOKIE_SECURE=true\n'
              printf 'ASSISTANT_ALLOWED_ORIGINS=%s\n' "$ASSISTANT_ALLOWED_ORIGINS"
              printf 'ASSISTANT_DATA_VOLUME=%s\n' "$volume_name"
            } > "$app_dir/.env"
            chmod 600 "$app_dir/.env"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            cd "$app_dir"
            docker compose pull
            if docker volume inspect "$volume_name" >/dev/null 2>&1 && docker run --rm --entrypoint python --user 0 -v "$volume_name":/data -v "$backup_dir":/backup "$BACKEND_IMAGE_NAME" -c "import os,sqlite3,time; src='/data/assistant.db'; dst='/backup/assistant-' + time.strftime('%Y%m%d-%H%M%S', time.gmtime()) + '.db'; con=sqlite3.connect(src); out=sqlite3.connect(dst); con.backup(out); out.close(); con.close(); os.chmod(dst,0o600)"; then
              echo 'sqlite backup created'
            else
              echo 'no existing SQLite volume/database; backup skipped'
            fi
            docker compose up -d --remove-orphans
            docker compose ps
            test "$(docker inspect --format='{{.State.Health.Status}}' paiguangguang-ai-backend)" = healthy
            test "$(docker inspect --format='{{.Config.Image}}' paiguangguang-ai-frontend)" = "$IMAGE_NAME"
            test "$(docker inspect --format='{{.Config.Image}}' paiguangguang-ai-backend)" = "$BACKEND_IMAGE_NAME"
            trap - ERR
            docker logout ghcr.io
