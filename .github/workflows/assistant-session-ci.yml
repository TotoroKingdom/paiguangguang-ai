name: Application CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "docs-codex/**"
      - "docs-work/**"
  push:
    branches:
      - dev
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-session-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app alembic

      - name: Run backend tests
        run: python -m pytest tests -q

      - name: Verify Alembic migration
        env:
          ASSISTANT_DATABASE_URL: sqlite:////tmp/paiguangguang-ci-migrations.db
        run: |
          rm -f /tmp/paiguangguang-ci-migrations.db
          python -m alembic upgrade head
          python -m alembic downgrade base

  frontend:
    name: Frontend tests and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for Playwright backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies for E2E
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Run Playwright route, assistant, and admin E2E
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-session-playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

  deployment-config:
    name: Deployment config preflight
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/example/paiguangguang-ai-frontend:ci
      BACKEND_IMAGE_NAME: ghcr.io/example/paiguangguang-ai-backend:ci
      ASSISTANT_OWNER_COOKIE_SECRET: ci-owner-secret-abcdefghijklmnopqrstuvwxyz
      ASSISTANT_OWNER_COOKIE_SECURE: "true"
      ASSISTANT_ADMIN_COOKIE_SECURE: "true"
      ASSISTANT_USER_COOKIE_SECURE: "true"
      ASSISTANT_ALLOWED_ORIGINS: https://example.invalid
      ASSISTANT_DEMO_CATALOG_ENABLED: "false"
      ASSISTANT_LLM_PROVIDER: openai
      ASSISTANT_LLM_BASE_URL: https://llm.example.invalid/v1
      ASSISTANT_LLM_MODEL: ci-model
      ASSISTANT_LLM_API_KEY: ci-dummy-key
      ASSISTANT_DATA_VOLUME: paiguangguang-ai-ci-config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate isolated Compose configuration
        run: docker compose config --quiet

      - name: Run deployment preflight with dummy values
        working-directory: backend
        run: python -m scripts.deploy_preflight

