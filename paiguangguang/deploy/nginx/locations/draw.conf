location = /draw {
    return 308 /draw/;
}

location /draw/ {
    # Excalidraw keeps its public host port 8081. The host-gateway entry is
    # supplied by docker-compose.web.yml so this also works from Nginx Docker.
    proxy_pass http://host.docker.internal:8081/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /draw;

    # sub_filter only works on uncompressed upstream responses. The outer
    # Nginx may still gzip the rewritten response for the browser.
    proxy_set_header Accept-Encoding "";
    proxy_redirect off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    sub_filter_once off;
    sub_filter_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json;

    # The official Excalidraw image is built for / and emits absolute paths.
    sub_filter 'src="/' 'src="/draw/';
    sub_filter 'href="/' 'href="/draw/';
    sub_filter '</head>' '<script>window.EXCALIDRAW_ASSET_PATH="/draw/";</script></head>';

    # Keep the PWA service worker scoped to /draw/ instead of the whole site.
    sub_filter 'new u("/sw.js",{scope:"/"' 'new u("/draw/sw.js",{scope:"/draw/"';
    sub_filter 's?s("/sw.js",u)' 's?s("/draw/sw.js",u)';

    # Rewrite the web manifest to the mounted path.
    sub_filter '"start_url":"/"' '"start_url":"/draw/"';
    sub_filter '"scope":"/"' '"scope":"/draw/"';
    sub_filter '"action":"/"' '"action":"/draw/"';
    sub_filter '"action":"/web-share-target"' '"action":"/draw/web-share-target"';
    sub_filter '"src":"/screenshots/' '"src":"/draw/screenshots/';
}
