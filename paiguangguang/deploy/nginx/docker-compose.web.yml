name: nginx

services:
  nginx:
    image: nginx:1.30.4
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8082:8082"
      - "80:80"
      - "443:443"
    volumes:
      - /home/nginx/certs:/etc/nginx/certs:ro
      - /home/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/nginx/conf.d:/etc/nginx/conf.d:ro
      - /home/my-website-ui/todo-demo-ui/todo-app.html:/usr/share/nginx/html/todo-app.html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  web:
    external: true
    name: web
