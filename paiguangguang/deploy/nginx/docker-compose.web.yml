services:
  nginx:
    ports:
      - "8080:80"
      - "80:80"
      - "443:443"
    volumes:
      - /home/nginx/certs:/etc/nginx/certs:ro
      - /home/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/nginx/conf.d:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - web

networks:
  web:
    external: true
    name: web
