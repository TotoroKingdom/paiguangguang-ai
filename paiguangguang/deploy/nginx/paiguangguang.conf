server {
    listen 80;
    server_name 1.12.47.29;

    client_max_body_size 12m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://paiguangguang-backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $frontend_upstream http://paiguangguang-frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name paiguangguang.xyz www.paiguangguang.xyz;

    return 301 https://www.paiguangguang.xyz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name paiguangguang.xyz;

    ssl_certificate /etc/nginx/certs/www.paiguangguang.xyz.pem;
    ssl_certificate_key /etc/nginx/certs/www.paiguangguang.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.paiguangguang.xyz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
