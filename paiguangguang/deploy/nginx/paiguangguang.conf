    ssl_certificate_key /etc/nginx/certs/www.paiguangguang.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 12m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/locations/draw.conf;
    include /etc/nginx/conf.d/locations/todo.conf;

