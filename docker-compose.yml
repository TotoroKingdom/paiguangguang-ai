services:
  backend:
    image: ${BACKEND_IMAGE_NAME:?BACKEND_IMAGE_NAME must be set}
    container_name: paiguangguang-ai-backend
    restart: unless-stopped
    environment:
      ASSISTANT_ENVIRONMENT: production
      ASSISTANT_DATABASE_URL: sqlite:////data/assistant.db
      ASSISTANT_OWNER_COOKIE_SECRET: ${ASSISTANT_OWNER_COOKIE_SECRET:?ASSISTANT_OWNER_COOKIE_SECRET must be set}
      ASSISTANT_OWNER_COOKIE_SECURE: ${ASSISTANT_OWNER_COOKIE_SECURE:-true}
      ASSISTANT_ALLOWED_ORIGINS: ${ASSISTANT_ALLOWED_ORIGINS:?ASSISTANT_ALLOWED_ORIGINS must be set}
      ASSISTANT_ADMIN_COOKIE_SECURE: ${ASSISTANT_ADMIN_COOKIE_SECURE:-true}
      ASSISTANT_USER_COOKIE_SECURE: ${ASSISTANT_USER_COOKIE_SECURE:-true}
      ASSISTANT_DEMO_CATALOG_ENABLED: "false"
      ASSISTANT_FILE_STORAGE_DIR: /data/user-files
      ASSISTANT_LLM_PROVIDER: ${ASSISTANT_LLM_PROVIDER:?ASSISTANT_LLM_PROVIDER must be set}
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:?ASSISTANT_LLM_BASE_URL must be set}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:?ASSISTANT_LLM_MODEL must be set}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:?ASSISTANT_LLM_API_KEY must be set}
      ASSISTANT_ADMIN_USERNAME: ${ASSISTANT_ADMIN_USERNAME:-admin}
      ASSISTANT_ADMIN_PASSWORD: ${ASSISTANT_ADMIN_PASSWORD:-}
    volumes:
      - assistant_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: ${IMAGE_NAME:?IMAGE_NAME must be set}
    container_name: paiguangguang-ai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  assistant_data:
    name: ${ASSISTANT_DATA_VOLUME:-paiguangguang-ai-assistant-data}
