  <g transform="translate(1370 655)"><circle r="83" stroke="#6bd3ef" stroke-width="3" stroke-opacity=".6" fill="none"/><circle r="48" stroke="#7b81df" stroke-opacity=".65" fill="none"/><circle r="22" fill="#8a9bf5" opacity=".75"/><circle cx="-50" cy="-65" r="10" fill="#8ef6ec"/><circle cx="82" cy="-18" r="6" fill="#a78bfa"/></g>
