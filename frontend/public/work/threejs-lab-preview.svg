<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">3D Lab — robot and kinetic experiments</title>
  <desc id="desc">A friendly white robot floats over a dark futuristic stage, surrounded by orbital lights and mechanical shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172c"/><stop offset=".58" stop-color="#0a1226"/><stop offset="1" stop-color="#182044"/></linearGradient>
    <radialGradient id="blue"><stop stop-color="#4dd5ee" stop-opacity=".28"/><stop offset="1" stop-color="#4dd5ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#9b7cff" stop-opacity=".3"/><stop offset="1" stop-color="#9b7cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2=".95" y2="1"><stop stop-color="#fff"/><stop offset=".49" stop-color="#e2f3ff"/><stop offset="1" stop-color="#9eaed1"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fdff"/><stop offset=".65" stop-color="#d7e7fb"/><stop offset="1" stop-color="#97a9d3"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d3e"/><stop offset="1" stop-color="#293962"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#abfff7"/><stop offset="1" stop-color="#50bff4"/></linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b1a1ff"/><stop offset=".45" stop-color="#5d6bbd"/><stop offset="1" stop-color="#293d79"/></linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="24" stdDeviation="27" flood-color="#050813" flood-opacity=".6"/></filter>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <circle cx="440" cy="430" r="570" fill="url(#blue)"/>
  <circle cx="1270" cy="290" r="490" fill="url(#violet)"/>
