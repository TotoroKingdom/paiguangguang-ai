    </g>
    <path d="M-30-110h60l12 25 26 11 26-9 41 42-10 25 11 28 24 13v58l-25 12-11 27 9 26-42 41-25-10-27 11-12 24h-58l-11-25-27-11-26 10-41-42 9-25-11-27-24-12v-58l25-12 11-27-10-25 41-42 26 9 26-11z" fill="url(#gear)" stroke="#a5b7ff" stroke-width="6" transform="scale(.65) rotate(12)"/>
