  <!-- Three dimensional gears hint at future experiments. -->
  <g transform="translate(1180 424)">
    <circle r="164" fill="#a78bfa" opacity=".1" filter="url(#glow)"/>
    <g stroke="#a8a3ff" stroke-opacity=".55" stroke-width="18" fill="none">
